name: Build and Release Contract

on:
  push:
    tags:
      - 'v1*'
      - 'v2*'
      - 'cf-v*'
      - 'pt-v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release-v1:
    if: startsWith(github.ref, 'refs/tags/v1')
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Splitter V1 contract release with SEP-55 build verification'
      package: 'soro-splitter'
      relative_path: 'contracts/splitter'
      home_domain: 'dobprotocol.com'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-v2:
    if: startsWith(github.ref, 'refs/tags/v2')
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Splitter V2 contract release with SEP-55 build verification'
      package: 'soro-splitter-v2'
      relative_path: 'contracts/splitter_v2'
      home_domain: 'dobprotocol.com'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  # Both contracts below are already live on mainnet but had no release job, so
  # their wasm had never been reproducibly built or attested. A separate tag
  # prefix per contract keeps their versions independent of the splitter's.
  release-crowdfunding:
    if: startsWith(github.ref, 'refs/tags/cf-v')
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Crowdfunding V1 contract release with SEP-55 build verification'
      package: 'crowdfunding-v1'
      relative_path: 'contracts/crowdfunding_v1'
      home_domain: 'dobprotocol.com'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-participation-token:
    if: startsWith(github.ref, 'refs/tags/pt-v')
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Participation Token contract release with SEP-55 build verification'
      package: 'participation-token'
      relative_path: 'contracts/participation_token'
      home_domain: 'dobprotocol.com'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
