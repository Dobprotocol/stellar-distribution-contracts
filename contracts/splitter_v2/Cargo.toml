[package]
name = "soro-splitter-v2"
version = "2.0.0"
edition = "2021"
description = "Tokenized distribution splitter with lazy distribution and DEX-tradeable participation tokens"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "23.0.3"

[dev-dependencies]
soroban-sdk = { version = "23.0.3", features = ["testutils"] }
# AUDIT 2026-08: the tests used to register a Stellar Asset Contract as the
# participation token, which is NOT what production deploys. That is why the
# missing `clawback` in update_shares went unnoticed. Use the real contract.
participation-token = { path = "../participation_token", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
