[package]
name = "crowdfunding-v1"
version = "0.2.0"
edition = "2021"
description = "Crowdfunding contract for DobProtocol - fixed price per share, escrow until goal met"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "23.0.3"

[dev-dependencies]
soroban-sdk = { version = "23.0.3", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
